name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      
      - name: Create Fresh Flutter Project
        run: |
          flutter create temp_project --project-name p2p_secure_call --platforms android
          rm -rf temp_project/lib/*
          cp -r lib/* temp_project/lib/
          cp pubspec.yaml temp_project/pubspec.yaml
      
      - name: Fix Gradle to Version 8.4
        run: |
          cd temp_project/android/gradle/wrapper
          rm -f gradle-wrapper.properties
          cat > gradle-wrapper.properties << 'EOF'
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.4-all.zip
          EOF
      
      - name: Fix Android Settings
        run: |
          cd temp_project/android
          rm -f settings.gradle
          cat > settings.gradle << 'EOF'
          pluginManagement {
              def flutterSdkPath = {
                  def properties = new Properties()
                  file("local.properties").withInputStream { properties.load(it) }
                  def flutterSdkPath = properties.getProperty("flutter.sdk")
                  assert flutterSdkPath != null, "flutter.sdk not set in local.properties"
                  return flutterSdkPath
              }()
              includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          plugins {
              id "dev.flutter.flutter-plugin-loader" version "1.0.0"
              id "com.android.application" version "8.2.0" apply false
              id "org.jetbrains.kotlin.android" version "1.9.10" apply false
          }
          include ":app"
          EOF
      
      - name: Fix App Build Gradle
        run: |
          cd temp_project/android/app
          rm -f build.gradle
          cat > build.gradle << 'EOF'
          plugins {
              id "com.android.application"
              id "kotlin-android"
              id "dev.flutter.flutter-gradle-plugin"
          }
          android {
              namespace = "com.yourapp.p2p_call"
              compileSdk = 35
              ndkVersion = flutter.ndkVersion
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
              sourceSets {
                  main.java.srcDirs += 'src/main/kotlin'
              }
              defaultConfig {
                  applicationId "com.yourapp.p2p_call"
                  minSdk = 24
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"
              }
              buildTypes {
                  release {
                      signingConfig = signingConfigs.debug
                      minifyEnabled false
                      shrinkResources false
                  }
              }
          }
          flutter {
              source = "../.."
          }
          dependencies {
              implementation "org.jetbrains.kotlin:kotlin-stdlib:1.9.10"
          }
          EOF
      
      - name: Inject Permissions into AndroidManifest
        run: |
          MANIFEST="temp_project/android/app/src/main/AndroidManifest.xml"
          sed -i 's|</manifest>|    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.BLUETOOTH" />\n    <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />\n    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-feature android:name="android.hardware.camera" android:required="true" />\n    <uses-feature android:name="android.hardware.microphone" android:required="true" />\n</manifest>|' "$MANIFEST"
          sed -i 's|android:theme="@style/LaunchTheme"|android:theme="@style/LaunchTheme"\n            android:showWhenLocked="true"\n            android:turnScreenOn="true"|' "$MANIFEST"
      
      - name: Get Dependencies
        run: |
          cd temp_project
          flutter pub get
      
      - name: Build APK
        run: |
          cd temp_project
          flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: P2P-Secure-Call-APK
          path: temp_project/build/app/outputs/flutter-apk/app-release.apk
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          files: temp_project/build/app/outputs/flutter-apk/app-release.apk
          tag_name: v1.0.${{ github.run_number }}
          name: "P2P Secure Call v1.0.${{ github.run_number }}"
          body: |
            ## P2P Secure Call APK
            
            Install this APK on both phones and start calling!
            
            ### Steps:
            1. Download `app-release.apk`
            2. Install on Phone A and Phone B
            3. Open app, note Device IDs
            4. Enter other phone ID and call!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
