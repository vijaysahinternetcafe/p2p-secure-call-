name: Build APK Automatically

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
      
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
      
      - name: Create Flutter Project
        run: |
          flutter create temp_project --project-name p2p_secure_call
          rm -rf temp_project/lib/*
          cp -r lib/* temp_project/lib/ 2>/dev/null || true
          cp pubspec.yaml temp_project/pubspec.yaml
          cp -r android/* temp_project/android/ 2>/dev/null || true
          cp -r ios/* temp_project/ios/ 2>/dev/null || true
          rm -rf lib android ios pubspec.yaml
          mv temp_project/* .
          mv temp_project/.* . 2>/dev/null || true
          rm -rf temp_project
          
      - name: Fix Android SDK
        run: |
          echo "sdk.dir=/usr/local/lib/android/sdk" > android/local.properties
          
      - name: Get Dependencies
        run: flutter pub get
      
      - name: Build Release APK
        run: flutter build apk --release
      
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: P2P-Secure-Call-APK
          path: build/app/outputs/flutter-apk/app-release.apk
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          tag_name: v1.0.${{ github.run_number }}
          name: "P2P Secure Call v1.0.${{ github.run_number }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
